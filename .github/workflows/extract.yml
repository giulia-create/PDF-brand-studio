name: Extract clean project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir -p extracted
          unzip -q pdf-brand-studio-clean-mobile.zip -d extracted
          cp -R extracted/pdf-brand-studio/. .
          rm -rf extracted

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Extract clean PDF Brand Studio project" || exit 0
          git push
